name: Bug report
description: Report behavior that is broken, unsafe, or surprising.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Zaphod to do?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the exact commands and repository state if possible.
      placeholder: |
        git branch --show-current
        git status --short --branch
        zaphod status
        zaphod switch
    validations:
      required: true
  - type: textarea
    id: actual-output
    attributes:
      label: Actual output
      description: Paste the Zaphod output or error message.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zaphod version
      placeholder: zaphod --version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
