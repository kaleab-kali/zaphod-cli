name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zaphod-linux
            binary_path: target/release/zaphod
          - os: macos-latest
            artifact_name: zaphod-macos
            binary_path: target/release/zaphod
          - os: windows-latest
            artifact_name: zaphod-windows.exe
            binary_path: target/release/zaphod.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Generate checksum
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          artifact = Path("dist") / "${{ matrix.artifact_name }}"
          digest = sha256(artifact.read_bytes()).hexdigest()
          artifact.with_name(f"{artifact.name}.sha256").write_text(
              f"{digest}  {artifact.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
