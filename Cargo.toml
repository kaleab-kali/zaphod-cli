[package]
name = "zaphod-cli"
version = "0.1.13"
edition = "2024"
description = "A cautious Git workflow CLI for paired branches."
readme = "README.md"
repository = "https://github.com/kaleab-kali/zaphod-cli"
license = "MIT"
keywords = ["git", "cli", "workflow", "branches"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "tests/**",
    "Cargo.lock",
    "Cargo.toml",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
]

[[bin]]
name = "zaphod"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
